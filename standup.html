<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Стендап · Roistat QA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="standup.css">
  <script src="standup.js" defer></script>
</head>
<body>
  <header><div class="wrap brand"><span class="logo">QA</span> Roistat QA <a href="./index.html">Каталог</a></div></header>
  <main class="wrap">
    <h1>Стендап</h1>
    <div class="workspace">
      <div id="fields">
        <fieldset class="day past"><legend>Вчера</legend>
          <fieldset class="count"><legend>Сколько релизов провели?</legend>
            <label><input type="radio" name="past-count" value="0" checked>Без релизов</label>
            <label><input type="radio" name="past-count" value="1">1 релиз</label>
            <label><input type="radio" name="past-count" value="2">2 релиза</label>
          </fieldset>
          <div class="outcome">
            <label><input id="accepted" type="checkbox">Провели приёмку</label>
            <textarea id="accepted-tasks" aria-label="Задачи, по которым провели приёмку" placeholder="Названия задач, если нужны" rows="2" hidden></textarea>
          </div>
          <div class="outcome">
            <label><input id="deferred" type="checkbox">Не провели приёмку</label>
            <textarea id="deferred-tasks" aria-label="Задачи, по которым не провели приёмку" placeholder="Названия задач, если нужны" rows="2" hidden></textarea>
          </div>
          <details><summary>Другие итоги</summary>
            <textarea id="yesterday" aria-label="Другие итоги" rows="2"></textarea>
          </details>
        </fieldset>
        <fieldset class="day current"><legend>Сегодня</legend>
          <fieldset class="count"><legend>Сколько релизов планируем?</legend>
            <label><input type="radio" name="today-count" value="0">Без релизов</label>
            <label><input type="radio" name="today-count" value="1" checked>1 релиз</label>
            <label><input type="radio" name="today-count" value="2">2 релиза</label>
          </fieldset>
          <div id="plans"></div>
          <div class="actions"><button id="add-task">+ Приёмка</button></div>
          <label for="other">Другие планы</label><textarea id="other" rows="2"></textarea>
        </fieldset>
        <fieldset class="day blockers"><legend>Проблемы</legend>
          <label for="problems">Что мешает работе?</label><textarea id="problems" rows="2" placeholder="—"></textarea>
        </fieldset>
      </div>
      <div class="result">
        <h2>Сообщение для чата</h2>
        <div id="preview"></div>
        <button id="copy">Скопировать сообщение</button>
        <span id="status" role="status"></span>
        <textarea id="manual-copy" aria-label="Текст для копирования" rows="8" readonly hidden></textarea>
      </div>
    </div>
  </main>
  <template id="release-template">
    <div class="plan release">
      <div class="plan-head"><strong>Релиз</strong></div>
      <label>Ведёт<select class="lead"><option value="">Выбрать</option></select></label>
      <fieldset class="people"><legend>Участвуют</legend></fieldset>
    </div>
  </template>
  <template id="task-template">
    <div class="plan task">
      <div class="plan-head"><strong>Приёмка</strong><button class="remove" aria-label="Удалить приёмку" title="Удалить приёмку">×</button></div>
      <label>Название задачи<input class="task-name" type="text"></label>
      <label>Ссылка на задачу (по желанию)<input class="url" type="url" pattern="https?://.+" placeholder="https://"></label>
      <fieldset class="people"><legend>QA</legend></fieldset>
    </div>
  </template>
</body>
</html>
