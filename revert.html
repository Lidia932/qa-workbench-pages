<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Запрос на откат · Roistat QA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="revert.css?v=2">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <script src="revert.js" defer></script>
</head>
<body>
  <header><div class="wrap brand"><span class="logo">QA</span> Roistat QA <a href="./index.html">Каталог</a></div></header>
  <main class="wrap">
    <h1>Запрос на откат</h1>
    <div class="revert-grid">
      <form id="RevertForm">
        <h2>Данные отката</h2>
        <div class="field">
          <label for="pr">PR</label>
          <div class="clearable" id="wrapPr">
            <input id="pr" name="pr" placeholder="Ссылка или номер PR" required>
            <button class="clearX" type="button" aria-label="Очистить PR" onclick="clearField('pr')">×</button>
          </div>
        </div>
        <div class="field">
          <label for="devSearchInput">Разработчик</label>
          <div class="selectSearch" id="devSearch" data-open="0">
            <input id="devSearchInput" autocomplete="off" aria-haspopup="listbox" aria-expanded="false" aria-controls="devSearchList" placeholder="Имя, фамилия или логин">
            <div class="dropdown" id="devDropdown"><div class="list" id="devSearchList" role="listbox" aria-label="Разработчики"></div></div>
          </div>
        </div>
        <div class="field">
          <label for="prichina">Причина отката</label>
          <div class="clearable" id="wrapPrichina">
            <textarea id="prichina" name="prichina" rows="3" required></textarea>
            <button class="clearX" type="button" aria-label="Очистить причину" onclick="clearField('prichina')">×</button>
          </div>
        </div>
        <div class="field"><label for="where">Где обнаружена проблема</label><select id="where" name="where"><option>На бета сервере</option><option>На бою</option></select></div>
        <details class="commit"><summary>Коммит</summary>
          <div class="clearable" id="wrapCommit">
            <input id="commit" name="commit" aria-label="Коммит" placeholder="-">
            <button class="clearX" type="button" aria-label="Очистить коммит" onclick="clearField('commit')">×</button>
          </div>
        </details>
      </form>
      <div class="result">
        <h2>Сообщение для чата</h2>
        <pre id="output"></pre>
        <div class="actions"><button class="primary" id="copy" type="button">Скопировать сообщение</button><small id="copy-status" role="status"></small></div>
      </div>
    </div>
    <details class="directory">
      <summary>Список разработчиков</summary>
      <label for="devListEditor">По одному разработчику в строке в формате «@логин Имя Фамилия»</label>
      <textarea id="devListEditor" rows="6" spellcheck="false"></textarea>
      <div class="actions">
        <button class="primary" onclick="saveDevelopersFromEditor()">Сохранить список</button>
        <button onclick="sortDevelopers()">По алфавиту</button>
        <button onclick="dedupeDevelopers()">Убрать дубли</button>
        <button onclick="trimDevelopers()">Убрать пробелы</button>
        <button onclick="resetDevelopersToDefault()">Вернуть исходный список</button>
      </div>
      <small id="editor-status" role="status"></small>
    </details>
  </main>
</body>
</html>
